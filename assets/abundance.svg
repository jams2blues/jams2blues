<?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="100%" height="100%"
  viewBox="-500 -500 1000 1000"
  preserveAspectRatio="xMidYMid slice"
  style="background:#fff"
  onload="init()">

<image
  id="fb"
  x="-500" y="-500"
  width="1000" height="1000"
  style="image-rendering:pixelated"
  xlink:href="data:image/png;base64," />

<g id="c" fill-rule="evenodd"></g>

<script><![CDATA[
"use strict";let f=0,RC=3,RO=[150,110,70],RI=[75,55,30],RA=[8,6,10],RF1=[.005,.0063,.0041],RF2=[.0037,.0059,.0071],ROff=[0,.4,.8],SC=5,RVC=SC*2,RP=[],r=0,rS=.002*Math.E,dR=1,rF1=.0027,rF2=.0039,rA=.2,oF=.2;for(let i=0;i<RC;i++){let M=[];for(let j=0;j<RVC;j++)M.push(Math.random()*2*Math.PI);RP.push(M);}function bS(s,o,n){let p=[],d=s*2;for(let i=0;i<d;i++){let a=i/d*2*Math.PI,x=(i%2==0?o:n)*Math.cos(a),y=(i%2==0?o:n)*Math.sin(a);p.push([x,y]);}return p}function rP(p,a){for(let i=0;i<p.length;i++){let X=p[i][0],Y=p[i][1],cX=X*Math.cos(a)-Y*Math.sin(a),cY=X*Math.sin(a)+Y*Math.cos(a);p[i]=[cX,cY];}return p}function fN(x,y,s){return Math.sin(.03*x+s)+Math.cos(.04*y-s)}function mR(p,ri,fm){let ph=RP[ri],am=RA[ri],f1=RF1[ri],f2=RF2[ri],o=[];for(let i=0;i<p.length;i++){let X=p[i][0],Y=p[i][1],R=Math.sqrt(X*X+Y*Y),A=Math.atan2(Y,X),d=am*(Math.sin(fm*f1+ph[i])+Math.sin(fm*f2+ph[i]))*.5,nR=R+d,nx=nR*Math.cos(A),ny=nR*Math.sin(A);o.push([nx,ny]);}return o}function cR(i,sf,rr,fr){let o=RO[i]*sf,n=RI[i]*sf,p=bS(SC,o,n);rP(p,rr+ROff[i]);return mR(p,i,fr)}function bAR(fr){let x=[];for(let i=0;i<RC;i++)x.push(cR(i,dR,r,fr));return x}function fN2(x,y,s){return Math.sin(.03*x+s)+Math.cos(.04*y-s)}function pTC(p,s){let d="";if(p.length<3)return d;d+="M"+p[0][0]+","+p[0][1];for(let i=0;i<p.length;i++){let c=p[i],n=p[(i+1)%p.length],v=p[(i+p.length-1)%p.length],mPX=(c[0]+v[0])*.5,mPY=(c[1]+v[1])*.5,mNX=(c[0]+n[0])*.5,mNY=(c[1]+n[1])*.5,z1=fN2(mPX,mPY,s+i),z2=fN2(mNX,mNY,s-i),c1x=mPX+z1*10,c1y=mPY+z1*10,c2x=mNX+z2*10,c2y=mNY+z2*10,ax=n[0],ay=n[1];d+=" C"+c1x+","+c1y+" "+c2x+","+c2y+" "+ax+","+ay;}return d}function pTCP(a){let s=f*.01,D="";a.forEach(k=>D+=pTC(k,s));return D}function tH(a,u){let tx=1.5*u*oF,ty=Math.sqrt(3)*u*oF,g=5,O=[];for(let i=-g;i<=g;i++){for(let j=-g;j<=g;j++){let xO=i*tx,yO=j*ty+(i%2?ty/2:0),fh=(i+j)%2!=0;a.forEach(pp=>{let np=pp.map(pt=>[pt[0],pt[1]]);if(fh)for(let K=0;K<np.length;K++)np[K][0]=-np[K][0];for(let K=0;K<np.length;K++){np[K][0]+=xO;np[K][1]+=yO;}O.push(np);});}}return O}function uGA(){f++;dR=1+rA*(Math.sin(f*rF1)+Math.sin(f*rF2))*.5;r=(f*rS)%(2*Math.PI);}function init(){let fb=document.getElementById("fb");if(fb)fb.setAttribute("display","none");requestAnimationFrame(anim);}function anim(){uGA();let rp=bAR(f),tp=tH(rp,2*(150*1.2)),d=pTCP(tp),C=document.getElementById("c");while(C.firstChild)C.removeChild(C.firstChild);let P=document.createElementNS("http://www.w3.org/2000/svg","path");P.setAttribute("fill","#000");P.setAttribute("stroke","none");P.setAttribute("fill-rule","evenodd");P.setAttribute("d",d);C.appendChild(P);requestAnimationFrame(anim);}
]]></script>
</svg>
